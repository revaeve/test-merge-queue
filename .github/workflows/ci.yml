# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  merge_group:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: nrwl/nx-set-shas@v3
      - run: npm ci
      # - run: npx nx format:check
      - run: npx nx affected -t lint --parallel=3
      - run: npx nx affected -t test --parallel=3 --configuration=ci
      - run: npx nx affected -t build --parallel=3

      - name: Test build to skip when in merge queue
        if: github.event_name == 'pull_request'
        run: npx nx run-many --target=build

      - name: Echo PR number Test 1
        run: |
          echo ${{ github.event.pull_request.number }}
          echo ${{ github.event.number }}

      - uses: actions-ecosystem/action-regex-match@v2
        id: regex-match
        with:
          text: ${{ github.event.pull_request.title }} # e.g. "Test: AB#16845 try to return PR number"
          regex: '^\w+:\s(.+#\d+).*$'

      - name: Echo PR number Test 2
        run: |
          echo "${{ steps.regex-match.outputs.group1 }}"

  test-final-check:
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - name: "Final check test"
        if: ${{ always() && !cancelled() && !failure() }}
        run: echo "final check"
